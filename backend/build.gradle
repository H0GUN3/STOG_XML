plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
}

group = 'com.stog'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.3')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('importSemasPlaces', JavaExec) {
    group = 'application'
    description = 'Imports the verified SEMAS ZIP into an explicitly confirmed local PostgreSQL schema.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.stog.backend.SemasPlaceImportCommand'
    def zip = providers.environmentVariable('STOG_IMPORT_ZIP')
    doFirst {
        if (!zip.isPresent()) throw new GradleException('STOG_IMPORT_ZIP is required')
        args '--zip', zip.get()
        def entry = providers.environmentVariable('STOG_IMPORT_ENTRY').orNull
        if (entry) args '--entry', entry
        def maximum = providers.environmentVariable('STOG_IMPORT_MAX_ROWS').orNull
        if (maximum) args '--max-rows', maximum
    }
}
