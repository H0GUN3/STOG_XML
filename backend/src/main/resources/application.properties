# Safe local default: listen only on this host. Public/LAN binding requires separate approval.
server.address=127.0.0.1
# Stable local backend port. Spring Boot environment/command-line overrides remain supported (SERVER_PORT / --server.port).
server.port=8080

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.parser.strict-duplicate-detection=true

# R2b private cover storage has no repository/static fallback. Startup fails closed unless this
# points to an existing writable non-symlink directory outside the classpath resource tree.
stog.media.root=${STOG_MEDIA_ROOT:}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
spring.servlet.multipart.location=${STOG_MEDIA_ROOT:}/temp

# Explicit owner-only test mode. When enabled, STOG_AUTH_RESTRICTED_OWNER_USER_ID must be one
# existing internal User UUID in full canonical 8-4-4-4-12 form; either hex case is accepted.
# Missing, shortened, or malformed configuration prevents application startup without echoing the value.
# Disabled mode preserves normal identity provisioning and session behavior.
stog.auth.restricted-owner.enabled=${STOG_AUTH_RESTRICTED_OWNER_ENABLED:false}
stog.auth.restricted-owner.user-id=${STOG_AUTH_RESTRICTED_OWNER_USER_ID:}

# Kakao verification is fail-closed by default. Local/operational launchers must explicitly supply
# STOG_AUTH_KAKAO_ENABLED=true and the numeric STOG_AUTH_KAKAO_EXPECTED_APP_ID.
stog.auth.kakao.enabled=${STOG_AUTH_KAKAO_ENABLED:false}
stog.auth.kakao.expected-app-id=${STOG_AUTH_KAKAO_EXPECTED_APP_ID:}
# Overrides are trusted only when this explicit fixture flag is true and both destinations are literal loopback HTTP.
stog.auth.kakao.fixture-mode=${STOG_AUTH_KAKAO_FIXTURE_MODE:false}
# Normal mode requires these exact official HTTPS endpoints; redirects and endpoint variations are rejected.
stog.auth.kakao.token-info-uri=${STOG_AUTH_KAKAO_TOKEN_INFO_URI:https://kapi.kakao.com/v1/user/access_token_info}
stog.auth.kakao.user-info-uri=${STOG_AUTH_KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}
