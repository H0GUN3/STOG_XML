import java.util.Properties

plugins {
    id 'com.android.application'
}

Properties localSettings = new Properties()
File localSettingsFile = rootProject.file('local.properties')
if (localSettingsFile.isFile()) {
    localSettingsFile.withInputStream { localSettings.load(it) }
}

def settingValue = { String localName, String environmentName ->
    if (localSettings.containsKey(localName)) {
        return localSettings.getProperty(localName)?.trim() ?: ''
    }
    System.getenv(environmentName)?.trim() ?: ''
}

String serverBaseUrl = settingValue('stog.server.baseUrl', 'STOG_SERVER_BASE_URL')
boolean localInstrumentationFixture = providers.gradleProperty('stogLocalInstrumentationFixture').orNull == 'true'
boolean releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase(Locale.ROOT).contains('release') }

android {
    namespace = 'com.stog.app'
    compileSdk = 37

    defaultConfig {
        applicationId = 'com.stog.app'
        minSdk = 23
        targetSdk = 36
        versionCode = 1
        versionName = '0.1.0'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'

        buildConfigField 'String', 'STOG_SERVER_BASE_URL', "\"${serverBaseUrl.replace('\\', '\\\\').replace('\"', '\\\"')}\""
    }

    buildTypes {
        debug {
            if (localInstrumentationFixture) {
                buildConfigField 'String', 'STOG_SERVER_BASE_URL', '"http://127.0.0.1:8080"'
            }
        }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

if (localInstrumentationFixture && releaseRequested) {
    throw new GradleException('stogLocalInstrumentationFixture is debug-only and cannot configure a release task')
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.google.android.material:material:1.13.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
